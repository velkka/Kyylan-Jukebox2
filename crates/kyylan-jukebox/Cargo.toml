[package]
name = "kyylan-jukebox"
description = "Kyylan Jukebox: plays local music through this machine's speakers while guests queue songs from their browsers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jukebox-audio = { path = "../jukebox-audio" }
jukebox-core = { path = "../jukebox-core" }
jukebox-server = { path = "../jukebox-server" }
rusqlite = "0.40.2"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
