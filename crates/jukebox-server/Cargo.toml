[package]
name = "jukebox-server"
description = "The HTTP API, realtime updates and embedded web UI for Kyylan Jukebox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dns-lookup = "4.0.1"
if-addrs = "0.15.0"
jukebox-core = { path = "../jukebox-core" }
mime_guess = "2.0.5"
rand = "0.10.2"
rusqlite = "0.40.2"
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path", "include-exclude"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
sha1 = "0.11.0"
regex = "1"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
