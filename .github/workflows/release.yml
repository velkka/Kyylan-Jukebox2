name: Release

# Build the macOS + Windows packages and publish a GitHub Release whenever a
# version tag (v*) is pushed.
on:
  push:
    tags:
      - 'v*'
  # Manual build-only run, for smoke-testing pipeline changes without releasing.
  workflow_dispatch:

permissions:
  contents: write # required to create the release

jobs:
  build-mac:
    runs-on: macos-latest # Apple Silicon runner → arm64 .dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build macOS package
        run: npm run package:mac
        env:
          # Unsigned build: skip Developer ID discovery (the afterPack hook
          # applies an ad-hoc signature so the app still runs locally).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest # native NSIS/portable build, x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Windows packages
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            release/*setup.exe
            release/*portable.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest # native build; better-sqlite3 is rebuilt for Linux here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Linux packages
        run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: [build-mac, build-win, build-linux]
    # Only publish for tag pushes; workflow_dispatch runs just build and stop.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so we can diff against the previous release
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Previous release = the most recent "Release X" commit before this tag
          # (robust even if version tags were rewritten onto a different history).
          PREV_COMMIT="$(git log "${TAG}^" --grep='^Release ' -n 1 --pretty=%H 2>/dev/null || true)"
          PREV_VER="$(git log "${TAG}^" --grep='^Release ' -n 1 --pretty=%s 2>/dev/null | awk '{print $2}')"
          {
            echo "## What's changed"
            echo
            if [ -n "$PREV_COMMIT" ]; then
              git log "${PREV_COMMIT}..${TAG}" --no-merges --invert-grep --grep='^Release ' --pretty='- %s'
              if [ -n "$PREV_VER" ]; then
                echo
                echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/v${PREV_VER}...${TAG}"
              fi
            else
              git log "${TAG}" --no-merges --invert-grep --grep='^Release ' --pretty='- %s'
            fi
            echo
            echo "---"
            echo "> **Unsigned builds.** macOS: ad-hoc signed, runs locally (Gatekeeper may warn on first open — right-click → **Open**). Windows: SmartScreen warns until the \`.exe\` is code-signed."
          } > RELEASE_NOTES.md
          echo "----- generated notes -----"; cat RELEASE_NOTES.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
