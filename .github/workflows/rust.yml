name: Rust

# The Rust port's own checks, on every platform the jukebox ships for. The Electron release
# workflow is separate and unaffected.
on:
  push:
    branches: [rust-port]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # The Rust port is held to recordings of the Electron code, so a change there must
      # re-check it.
      - 'src/main/**'
      - 'src/shared/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/main/**'
      - 'src/shared/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cpal's ALSA backend.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # The lint job runs on Linux, where the tray and dialogs aren't compiled.
      - if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Includes reading the data directory Electron v0.2.15 wrote, and checking this
      # platform's default data folder is Electron's.
      # --no-fail-fast: one failing test binary shouldn't hide the results of the others.
      - run: cargo test --workspace --locked --no-fail-fast
